[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "babysteerling"
version = "0.1.0"
description = "A didactic package to develop Interpretable Language Models (ILMs)."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "pyc-team", email = "barbiero@tutanota.com" }]
requires-python = ">=3.9"
dependencies = [
    "torch",
    "tokenizers",
    "pytorch-concepts==1.0.0a5",
    "plotly"
]

[project.optional-dependencies]
# heavier dependencies only needed to build a concept dataset (babysteerling.data.atlas),
# kept separate so installing the model itself doesn't force them on everyone
atlas = [
    "transformers",
    "sentence-transformers",
    "scikit-learn",
    "accelerate",
]

[project.urls]
Homepage = "https://github.com/pyc-team/babysteerling"

[tool.setuptools.packages.find]
include = ["babysteerling*"]
