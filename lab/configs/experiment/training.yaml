# @package training
# Optimization schedule and loss weights.
lr: 3e-4
min_lr: 3e-5
warmup_steps: 200
max_steps: 5000
weight_decay: 0.1

# validation
val_check_interval: 5
limit_val_batches: 10
check_val_every_n_epoch: 1

# checkpointing
resume_from_checkpoint: false  # resume from the last checkpoint in checkpoint_dir (see train.py's resume logic)
enable_checkpointing: true  # save checkpoints to disk (see train.py's resume logic)
checkpoint_dir: ./checkpoints  # where to save checkpoints (see train.py's resume logic)
checkpoint_filename: "{step:06d}"
save_last: true  # save a "last.ckpt" checkpoint (see train.py's resume logic)
every_n_train_steps: 10  # how often to save a resumable checkpoint (see train.py's resume logic)

# logging
log_every_n_steps: 1
enable_progress_bar: true  # show a progress bar during training (see train.py's resume logic)

# device
devices: 1
accelerator: "auto"

# Sampling parameters
gen_max_new_tokens: 200
gen_temperature: 0.8
gen_top_k: 50
gen_steps: 50

# Target definition for dynamic callback instantiation
generation_callback:
  _target_: babysteerling.callback.TextGenerationLogger
  max_new_tokens: ${training.gen_max_new_tokens}
  temperature: ${training.gen_temperature}
  top_k: ${training.gen_top_k}
  gen_steps: ${training.gen_steps}
